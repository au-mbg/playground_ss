
name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.1
          log-level: vvv
          cache: true
          run-install: false

      - name: Debug Pixi installation
        run: pixi install --locked -vvv


      - name: Render and assemble both course sites
        run: pixi run publish

      - name: Stage notebooks
        run: pixi run stage-notebooks

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: course-notes/_site

      - name: Upload staged notebooks
        uses: actions/upload-artifact@v4
        with:
          name: course-notebooks
          path: build/notebooks
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-notebooks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download staged notebooks
        uses: actions/download-artifact@v4
        with:
          name: course-notebooks
          path: notebooks

      - name: Publish notebooks to built-notebooks
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: built-notebooks
          folder: notebooks
          target-folder: built_notebooks
          clean: true
          commit-message: Update notebooks

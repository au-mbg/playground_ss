project:
  type: website

website:
  title: "Genetics"
  search: true
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: Lessons
        contents:
          - lessons/TØ1.qmd

brand: _brand.yml

filters:
  - callout-solution
  - strip-solution
  - _extensions/au-mbg/jupyterlite-link.lua

format:

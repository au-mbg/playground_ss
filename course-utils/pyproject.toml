
[project]
name = "course-utils"
version = "0.1.0"
description = "Reusable Python helpers for the course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "playground"
module-root = "src"

[project.optional-dependencies]
standard = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "ipywidgets>=8.1",
    "anywidget>=0.9.18",
    "plotly>=6.3.0",
    "scipy",
    "biopython",
    "jupyter"

]

pyodide = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "ipywidgets",
    "anywidget",
    "plotly",
    "scipy",
    "biopython",
]
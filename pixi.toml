[workspace]
authors = ["COURSE_AUTHOR <author@example.org>"]
channels = ["conda-forge"]
name = "COURSE_REPOSITORY"
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]
version = "0.1.0"

[tasks.render]
args = [{ "arg" = "profile", default = "student", choices = ["student", "instructor"] }]
cmd = "quarto render --profile {{profile}}"
cwd = "course-notes"
description = "Render one website profile"

[tasks.preview]
args = [{ "arg" = "profile", default = "student", choices = ["student", "instructor"] }]
cmd = "quarto preview --profile {{profile}}"
cwd = "course-notes"
description = "Preview the student or instructor website"

[tasks.render-all]
depends-on = ["clean", "_render-student", "_render-instructor"]
description = "Clean and render both website profiles"

[tasks.clean]
cmd = "rm -rf _site _output .quarto *.quarto_ipynb **/*.quarto_ipynb **/*.quarto_ipynb_*"
cwd = "course-notes"
depends-on = ["_clean-python"]
description = "Remove generated Quarto output, state, notebooks, and Python caches"

[tasks.publish]
depends-on = ["render-all"]
description = "Render both profiles and assemble the GitHub Pages artifact"

[tasks._render-student]
cmd = "quarto render --profile student"
cwd = "course-notes"

[tasks._render-instructor]
cmd = "quarto render --profile instructor"
cwd = "course-notes"

[tasks.render-notebooks]
cmd = "quarto render 'lessons/TØ1.qmd' --to ipynb"
cwd = "course-notes"
description = "Render lesson notebooks for JupyterLite"

[tasks._clean-python]
cmd = "rm -rf course-utils/src/course_utils/__pycache__ scripts/__pycache__"

[tasks.stage-notebooks]
cmd = """
rm -rf build/notebooks &&
mkdir -p build/notebooks/student build/notebooks/instructor &&
cp course-notes/_site/lessons/*.ipynb build/notebooks/student/ &&
cp course-notes/_site/instructor/lessons/*.ipynb build/notebooks/instructor/ &&
echo "Student notebooks: $(find build/notebooks/student -name '*.ipynb' | wc -l | tr -d ' ')" &&
echo "Instructor notebooks: $(find build/notebooks/instructor -name '*.ipynb' | wc -l | tr -d ' ')"
"""
description = "Stage generated notebooks for the built-notebooks branch"

[dependencies]
python = "3.12.*"
quarto = ">=1.9.38,<2"
pandas = ">=3.1.0,<4"
matplotlib = ">=3.11.2,<4"
ipywidgets = ">=8.1.9,<9"

[pypi-dependencies]
jupyter = ">=1.1.1, <2"
course-utils = { path = "course-utils/", editable = true }

[feature.dev.dependencies]
uv = "*"

[environments]
default = { features = [] }
dev = { features = ["dev"], solve-group = "default" }